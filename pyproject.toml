[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-agent"
version = "0.1.0"
description = "Autonomous agentic code-review engine for GitLab merge requests"
requires-python = ">=3.10"
dependencies = [
    "Jinja2>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
review-agent = "review_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review_agent = ["prompts/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
