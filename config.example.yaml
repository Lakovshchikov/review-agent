# Пример конфигурации review-agent. Скопируйте в config.yaml и отредактируйте.
# Справочник всех ключей (тип, значение по умолчанию, смысл): docs/configuration.md
# Относительные пути считаются от текущей папки процесса.

provider:
  # Провайдер и модель OpenCode; склеиваются в "anthropic/claude-sonnet-4-5#medium".
  # Не повторяйте провайдера в model (НЕ "anthropic/claude-...").
  name: anthropic
  model: claude-sonnet-4-5
  # Обязательный ключ: low / medium / high… (variant OpenCode).
  # null — для моделей без вариантов (локальные), иначе "Variant unavailable".
  reasoning_effort: medium
  # Только для справки, движком не читается: авторизация — `opencode auth login`.
  api_key_env: ANTHROPIC_API_KEY

harness:
  # Шаблон вызова харнесса. Плейсхолдеры: {agent}, {model}, {prompt_file}.
  # --standalone и передача промпта через --file ОБЯЗАТЕЛЬНЫ, менять не нужно —
  # почему, см. docs/decisions.md.
  command:
    - opencode
    - run
    - --standalone
    - --agent
    - "{agent}"
    - --model
    - "{model}"
    - --file
    - "{prompt_file}"
    - "Внимательно прочитай вложенный файл целиком и строго следуй его инструкциям."
  # Имя read-only агента, которого review-agent генерирует в opencode.json worktree.
  agent_name: reviewer

report:
  # Отчёт ручного режима (`review-agent --repo ...`); {run_id} подставляется.
  output_path: "./reports/review-{run_id}.md"

# Knowledge-skill файлы — подсказки агенту, не ограничение. Только абсолютные пути.
skills: []

safety:
  # Пишется только в safety-note прогона; язык отчёта задан в промпте (русский).
  output_language: ru
  # DENYLIST shell-команд агента (всё неперечисленное разрешено; allowlist
  # в OpenCode 2.0.21 не работает — docs/decisions.md). Свой список заменяет этот целиком.
  denied_bash_patterns:
    - "npm *"
    - "npx *"
    - "yarn *"
    - "pnpm *"
    - "bun *"
    - "*test*"
    - "*build*"
    - "*lint*"
    - "tsc*"
    - "node *"
    - "python *"
    - "python3 *"
    - "ruby *"
    - "rm *"
    - "curl *"
    - "wget *"
    - "sh *"
    - "bash *"
    - "powershell *"
    - "cmd *"

# Рабочая папка: всё, что пишет review-agent (кроме отчётов ручного режима).
# Раскладка и что когда удаляется — docs/work-dir.md.
storage:
  work_dir: ./.review-agent
  # logs/, dry-run/, debug/ старше N дней удаляются в начале прохода poll; null — не удалять.
  retention_days: 7
  # Кэш-клон в repos/, не использовавшийся N дней, удаляется; null — не удалять.
  repo_retention_days: 30

# Учёт расхода (секция необязательна; ниже — значения по умолчанию).
# Подробно — docs/usage-accounting.md.
usage:
  enabled: true                 # false — ни журнала, ни вопросов о квоте
  source: opencode              # opencode | none
  # Если сессии прогонов не находятся, добавьте сюда --standalone.
  session_list_command: [opencode, session, list]
  session_export_command: [opencode, session, export, "{session_id}"]
  quota_windows: [5h, week]     # окна лимита подписки для интерактивного замера
  # Справочник цен LiteLLM (URL или путь); загружается заново при каждом `review-agent usage`.
  price_catalog: https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json
  # Свои цены в формате записи справочника; заменяют запись справочника целиком.
  price_overrides:
    openai/some-model-not-in-catalog:   # условное имя; цифры — пример
      input_cost_per_token: 0.00000125
      cache_read_input_token_cost: 0.000000125
      output_cost_per_token: 0.00001

# Опрос GitLab — только для `review-agent poll`. Кредов здесь нет: `glab` должен
# быть авторизован (`glab auth login --hostname <hostname>`), комментарии
# публикуются от его учётной записи. Подробно — docs/polling.md.
gitlab:
  hostname: gitlab.example.local
  # MR берётся, если хотя бы один из них назначен ревьюером (не автором/assignee).
  # Можно не указывать, если у каждого включённого проекта свой reviewers.
  reviewers:
    - ai-reviewer
  review_drafts: false          # draft-MR пропускаются
  min_report_chars: 200         # более короткий или пустой отчёт не публикуется
  # Claim «ревью выполняется» старше N минут считается брошенным.
  # Не меньше лимита задачи Task Scheduler (-ExecutionTimeLimitHours, 4 ч).
  claim_ttl_minutes: 240
  projects:
    # Только путь: review-agent сам держит bare-клон в <work_dir>/repos/ (авторизация через glab).
    - path: b2c/front-shopping
    # Свой клон: review-agent только делает в нём fetch веток MR.
    - path: b2c/front-tools
      local_repo: C:/repos/front-tools
      remote: origin                     # по умолчанию origin; только вместе с local_repo
    # Переопределения проекта: enabled, reviewers, review_drafts, provider, skills.
    # Заменяют глобальное значение целиком (provider — весь блок со своим reasoning_effort).
    - path: b2c/front-checkout
      local_repo: C:/repos/front-checkout
      reviewers: [ai-reviewer, checkout-lead]
      provider:
        name: openai
        model: gpt-5
        reasoning_effort: high
      skills: []
    # Выключенный проект не опрашивается и не считается сбоем.
    - path: b2c/legacy-admin
      local_repo: C:/repos/legacy-admin
      enabled: false
