# Пример конфигурации review-agent. Скопируйте в config.yaml и отредактируйте.
# Полный контекст решений — см. /AGENTS.md.
#
# Синтаксис ниже сверен ВЖИВУЮ с реальным OpenCode CLI v2.0.21 (opencode
# --help, opencode run --help, opencode debug agents, и прямыми прогонами
# с реальным облачным провайдером) — не предположение, а проверенные факты,
# включая несколько, которые изначально предполагались иначе и были
# исправлены после реального тестирования (см. harness_config.py).

provider:
  # Имя провайдера и модель — склеиваются адаптером в строку вида
  # "anthropic/claude-sonnet-4-5#medium" (см. ниже про reasoning_effort).
  # НЕ дублируйте имя провайдера в поле model (т.е. НЕ "anthropic/claude-...").
  name: anthropic
  model: claude-sonnet-4-5
  # Reasoning effort задаётся явно — не оставляем харнессу default.
  # В OpenCode это и есть "variant" в модельной строке provider/model#variant
  # (напр. #high, #medium, #low — см. https://opencode.ai/docs/models).
  # ВАЖНО (проверено вживую): variant существует не у всех моделей — для
  # локальных моделей (напр. Ollama) без явно заданных вариантов суффикс
  # ломает вызов ("Variant unavailable"). Для таких моделей ставьте явно
  # `reasoning_effort: null` — поле обязательно (ключ должен быть), но
  # значение может быть null, если применимость явно не нужна.
  reasoning_effort: medium
  # Имя переменной окружения, где лежит ключ провайдера (сам ключ в
  # конфиг не кладём). Настраивается через `opencode auth login`.
  api_key_env: ANTHROPIC_API_KEY

harness:
  # Шаблон команды харнесса. Плейсхолдеры подставляются адаптером:
  #   {model}       -> "<provider.name>/<provider.model>#<reasoning_effort>"
  #   {prompt_file} -> путь к файлу с отрендеренным review-промптом ЦЕЛИКОМ
  #   {agent}       -> имя сгенерированного read-only агента (= harness.agent_name)
  #
  # ВАЖНО (проверено вживую, реальный баг): промпт передаётся через
  # `--file {prompt_file}`, а НЕ как позиционный текстовый аргумент
  # ("{prompt}"). На Windows `opencode` резолвится через PATH в
  # `opencode.CMD` (npm-шим) — такой .CMD-файл Windows исполняет через
  # cmd.exe, а cmd.exe обрывает аргумент на первом переводе строки. Из-за
  # этого позиционный многострочный промпт долетал до модели ОБРЕЗАННЫМ
  # до первой строки ("Role: Senior Software Engineer." и всё) — модель
  # честно отвечала на то немногое, что получила, без единого вызова
  # инструмента. `--file` передаёт содержимое как вложение, минуя
  # построчный парсинг cmd.exe, и было подтверждено вживую: модель видит
  # сообщение целиком, включая все абзацы после первого.
  command:
    - opencode
    - run
    # --standalone ОБЯЗАТЕЛЕН (проверено вживую): без него opencode
    # использует долгоживущий background-сервис, который может не знать
    # о только что созданном worktree (каждый прогон — новая директория)
    # и упасть с "Agent not found" на только что сгенерированном агенте.
    - --standalone
    - --agent
    - "{agent}"
    - --model
    - "{model}"
    - --file
    - "{prompt_file}"
    - "Внимательно прочитай вложенный файл целиком и строго следуй его инструкциям."
  # Имя агента, которого движок генерирует в opencode.json внутри worktree.
  # Подробнее про permission-карту — src/review_agent/harness_config.py.
  agent_name: reviewer

report:
  # {run_id} подставляется автоматически (уникален на каждый прогон).
  output_path: "./reports/review-{run_id}.md"

# Опциональные knowledge-skill файлы — подсказки по паттернам ошибок,
# не ограничение. По умолчанию пусто (без skill'ов).
skills: []

safety:
  output_language: ru
  # DENYLIST паттернов для bash (не allowlist!). Изначально задумывался
  # allowlist (deny-by-default безопаснее denylist'а, который можно
  # обойти чуть другим вызовом) — но проверено вживую на реальном
  # облачном провайдере: если добавить "*": "deny" в карту permission.bash,
  # bash-инструмент становится ПОЛНОСТЬЮ недоступен, даже для явно
  # разрешённых паттернов. Без catch-all'а неперечисленные команды
  # разрешены по умолчанию. Поэтому единственный рабочий вариант —
  # denylist конкретных опасных паттернов (слабее принципиально, но это
  # то, что реально работает в этой версии OpenCode). Подробности и
  # живая проверка — src/review_agent/harness_config.py.
  denied_bash_patterns:
    - "npm *"
    - "npx *"
    - "yarn *"
    - "pnpm *"
    - "bun *"
    - "*test*"
    - "*build*"
    - "*lint*"
    - "tsc*"
    - "node *"
    - "python *"
    - "python3 *"
    - "ruby *"
    - "rm *"
    - "curl *"
    - "wget *"
    - "sh *"
    - "bash *"
    - "powershell *"
    - "cmd *"
