schema: spec-driven

# Project context
context: |
  Проект: автономный агент для код-ревью Merge Request'ов в приватном
  VPN-only GitLab. Работает локально (Windows, разворачивается через
  Task Scheduler), архитектура платформонезависима для последующего
  переноса в приватный GitLab CI. Изначально только frontend-репозитории,
  в будущем возможны backend и другие стеки.

  Ключевой эмпирический вывод (из предыдущего 3-недельного исследования
  автора на том же классе задачи): recall находок у агента ВЫШЕ, когда он
  свободно исследует репозиторий сам, и ПАДАЕТ, когда поведение жёстко
  задано workflow-skill'ом или заранее подготовленным "brief" с
  группировкой файлов/зон риска. Любая предзаданная методология ревью
  (порядок исследования, candidate-verification policy, stopping rule)
  снижает recall — даже сильно урезанная. Это определяет архитектуру:

  - Движок ревью: agentic-харнесс с ПОЛНЫМ tool-access к изолированному
    git worktree (не diff-pipeline). Харнесс headless/non-interactive,
    провайдер модели (Claude/Codex/локальная модель) задаётся конфигом,
    не зашит в код. Reasoning effort/thinking level — явный конфиг на
    провайдера, не оставлять default.
  - Никакого обязательного workflow-skill. Методология ревью (что
    проверять, SEV, формат) идёт ОДНИМ прямым user-prompt'ом на каждый
    запуск. Допускается опциональный, переключаемый knowledge-skill слой
    (справочник частых паттернов ошибок) как подсказка, не ограничение —
    механизм должен поддерживать включение/выключение per-run.
  - Подготовка контекста перед запуском — МИНИМАЛЬНАЯ: изолированный
    git worktree, base/head SHA, scratch-путь, указатель (путь, не
    содержимое) на AGENTS.md/CLAUDE.md целевого репозитория и на docs/,
    если есть, title+description MR. НЕ готовить заранее diff.patch,
    changed-files группировку, risk-zones, dependency-impact — агент
    строит это сам (git log/diff/grep и т.п.).
  - Безопасность: во время ревью — строго read-only. Нельзя выполнять
    код/тесты/сборку/lint из MR. Агенту не даём общий веб-доступ и не
    даём права на запись в GitLab (комментарий публикует только
    оркестратор, после получения отчёта от агента, не сам агент).
    Это осознанно жёстче, чем в ручных экспериментах — цикл полностью
    автономный, без присмотра человека.
  - GitLab-интеграция: `glab` (официальный CLI от GitLab), не
    python-gitlab и не свой REST-клиент — для листинга MR по
    reviewer-фильтру и публикации комментариев. python-gitlab — только
    fallback, если что-то неудобно через glab.
  - Идемпотентность/состояние: хранится в самом GitLab, не в локальном
    файле — маркер в комментарии бота вида
    `<!-- ai-review: sha=<head_sha> -->`, ключ (project, MR iid,
    head_sha). Это намеренно даёт будущую фичу "ревью на новый diff
    после правок разработчика" без переделки — новый head_sha просто не
    находит маркера.
  - Фильтр опроса: только MR, где заданный в настройках пользователь
    (или список) указан как reviewer.
  - Планировщик: НЕ пишем свой кроссплатформенный cron/daemon. Работа —
    один идемпотентный CLI-вызов (один проход опроса/ревью, без
    внутреннего state в процессе), который дёргает нативный шедулер
    среды: Task Scheduler локально сейчас, cron/systemd timer или
    GitLab CI `schedule` в будущем. Entrypoint не должен знать, кто его
    вызвал.

  Рассмотренные и отклонённые готовые решения:
  - PR-Agent / Qodo Merge (open-source) — зрелый и популярный, но
    архитектурно diff-pipeline с фиксированной методологией промпта —
    именно то, что эмпирически снижает recall под эту задачу.
  - gitlab-review-agent, pr-review-bot (нишевые OSS-проекты) —
    архитектурно ближе (agentic), но незрелые (единицы-десятки звёзд),
    Linux/Docker-ориентированы, не годятся как основа при старте на
    Windows. Взяты на заметку паттерны (НЕ код) для будущих версий:
    инкрементальный "smart base SHA" re-review, verification loop перед
    записью finding, авто-resolve старых AI-тредов при фиксе,
    self-generating best-practices ruleset из истории фидбека.

  Дорожная карта (отдельные OpenSpec change, НЕ один монолит):
  1. core-review-engine — worktree + минимальный agent-конфиг + прямой
     промпт + вызов харнесса -> markdown-отчёт в локальный файл
     (dry-run, без публикации в GitLab). Механизм опциональных skills
     заложить архитектурно, без контента. Цель — проверить реальный
     recall на тестовом MR до вложений в остальную обвязку.
  2. gitlab-polling-and-publishing — glab-опрос по reviewer-фильтру,
     идемпотентная публикация отчёта, маркер состояния.
  3. scheduling-and-multi-repo-config — Task Scheduler, конфиг на
     несколько репозиториев, логирование.
  Не в v1 (бэклог отдельных будущих change): авто-resolve AI-тредов,
  self-generating best-practices skill из истории фидбека.

  Все артефакты и ответы агента по умолчанию — на русском языке.

