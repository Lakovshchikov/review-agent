# Project context
context: |
  Полный контекст проекта (архитектурные решения, ограничения,
  инструменты, рассмотренные и отклонённые альтернативы, дорожная
  карта) находится в /AGENTS.md в корне репозитория — прочитай его
  перед планированием или реализацией чего-либо. Этот файл — не
  замена, а короткая отсылка плюс openspec-специфичный статус.

  Статус дорожной карты (см. AGENTS.md п.7 за полным описанием):
  1. core-review-engine — применён и заархивирован
     (openspec/changes/archive/2026-10-02-core-review-engine). Проверен
     на реальном бенчмарк-MR (b2c/front-shopping !544) с реальным
     облачным провайдером — go-решение зафиксировано в
     validation-notes.md этого архива. Два реальных бага пайплайна
     найдены и исправлены в процессе (Windows-кодировка вывода;
     критичная обрезка многострочного промпта из-за cmd.exe). Не
     сделано: количественное сравнение находок с эталонным списком A-M
     из исходного исследования (исходный документ недоступен) — см.
     тот же validation-notes.md.
  2. gitlab-polling-and-publishing — применён и заархивирован
     (openspec/changes/archive/2026-10-02-gitlab-polling-and-publishing).
     `review-agent poll` проверен на боевом GitLab (git.platops.ru,
     b2c/front-shopping): публикация комментария с маркером на !544,
     пропуск уже отревьюенного MR, --all, --dry-run, lock одного прохода.
     По ходу добавлен --include-closed и исправлено определение терминала
     на Windows (< NUL). Go-решение и что учесть в Change 3 — в
     validation-notes.md этого архива.
  3. scheduling-and-multi-repo-config — применён и заархивирован
     (openspec/changes/archive/2026-10-02-scheduling-and-multi-repo-config).
     Проверен на Windows и боевом GitLab (задача Task Scheduler, рабочая
     папка с очисткой, лог прохода, claim в GitLab, настройки проекта).
     Итог и бэклог — validation-notes.md этого архива.
  4. managed-repo-cache — применён и заархивирован
     (openspec/changes/archive/2026-10-04-managed-repo-cache).
     local_repo необязателен: кэш bare-клонов в <work_dir>/repos/ с
     авторизацией через glab. Проверен на Windows и боевом GitLab (в т.ч.
     клон без консоли) — validation-notes.md этого архива.

  Дорожная карта п.1–4 выполнена; следующие change — из бэклога AGENTS.md п.7.

  Все артефакты и ответы агента по умолчанию — на русском языке.

