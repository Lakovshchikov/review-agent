schema: spec-driven

# Project context
context: |
  Полный контекст проекта (архитектурные решения, ограничения,
  инструменты, рассмотренные и отклонённые альтернативы, дорожная
  карта) находится в /AGENTS.md в корне репозитория — прочитай его
  перед планированием или реализацией чего-либо. Этот файл — не
  замена, а короткая отсылка плюс openspec-специфичный статус.

  Статус дорожной карты (см. AGENTS.md п.7 за полным описанием):
  1. core-review-engine — применён и заархивирован
     (openspec/changes/archive/2026-10-02-core-review-engine). Проверен
     на реальном бенчмарк-MR (b2c/front-shopping !544) с реальным
     облачным провайдером — go-решение зафиксировано в
     validation-notes.md этого архива. Два реальных бага пайплайна
     найдены и исправлены в процессе (Windows-кодировка вывода;
     критичная обрезка многострочного промпта из-за cmd.exe). Не
     сделано: количественное сравнение находок с эталонным списком A-M
     из исходного исследования (исходный документ недоступен) — см.
     тот же validation-notes.md.
  2. gitlab-polling-and-publishing — применён и заархивирован
     (openspec/changes/archive/2026-10-02-gitlab-polling-and-publishing).
     `review-agent poll` проверен на боевом GitLab (git.platops.ru,
     b2c/front-shopping): публикация комментария с маркером на !544,
     пропуск уже отревьюенного MR, --all, --dry-run, lock одного прохода.
     По ходу добавлен --include-closed и исправлено определение терминала
     на Windows (< NUL). Go-решение и что учесть в Change 3 — в
     validation-notes.md этого архива.
  3. scheduling-and-multi-repo-config — применён и заархивирован
     (openspec/changes/archive/2026-10-02-scheduling-and-multi-repo-config).
     Проверен на Windows и боевом GitLab (задача Task Scheduler, рабочая
     папка с очисткой, лог прохода, claim в GitLab, настройки проекта).
     Итог и бэклог — validation-notes.md этого архива.
  4. managed-repo-cache — применён и заархивирован
     (openspec/changes/archive/2026-10-04-managed-repo-cache).
     local_repo необязателен: кэш bare-клонов в <work_dir>/repos/ с
     авторизацией через glab. Проверен на Windows и боевом GitLab (в т.ч.
     клон без консоли) — validation-notes.md этого архива.

  5. review-usage-accounting — применён и заархивирован
     (openspec/changes/archive/2026-10-04-review-usage-accounting).
     Проверен вживую: интерактивный poll с замером квоты, poll --all,
     дрейф формата, сводка с реальными ценами — validation-notes.md.
     Журнал расхода usage/ledger.jsonl, замер остатка квоты в интерактиве,
     `review-agent usage`.

  6. gitlab-file-links — применён и заархивирован
     (openspec/changes/archive/2026-10-04-gitlab-file-links). Ссылки на файлы в отчёте ведут на
     GitLab в отревьюенном коммите (blob/<head_sha>/path#L..); проверен на
     реальных отчётах и живым poll --dry-run (!11) — validation-notes.md.

  7. restructure-documentation — применён и заархивирован
     (openspec/changes/archive/2026-10-04-restructure-documentation).
     README — справочник по использованию, подробности в docs/, в AGENTS.md
     карта репозитория (п.10) и правило актуализации документации (п.11);
     tests/test_docs.py сверяет README с CLI. Поведение не менялось.

  8. configurable-review-prompt — применён и заархивирован
     (openspec/changes/archive/2026-10-04-configurable-review-prompt).
     Промпт рендерится из Jinja2-шаблона (встроенный посимвольно равен
     прежнему baseline), секция prompt в конфиге с переопределением проекта
     по ключам, проверка шаблонов перед работой, review-agent prompt-check.
     Проверен вживую (poll --all/интерактив, ручной режим) —
     validation-notes.md. Найден баг вне scope: skill-файлы не читаются
     агентом (external_directory) — в бэклоге AGENTS.md п.7.

  Дорожная карта п.1–8 выполнена; следующие change — из бэклога AGENTS.md п.7.

  Все артефакты и ответы агента по умолчанию — на русском языке.

# Правило актуализации документации живёт в AGENTS.md п.11 — здесь только
# отсылки к нему, чтобы оно попадало в инструкции артефактов и операций.
rules:
  proposal:
    - "В Impact перечисли документы, которые затронет change, по таблице AGENTS.md п.11 (README.md, docs/*.md, AGENTS.md, config.example.yaml, openspec/config.yaml), или явно напиши, что документация не затронута и почему."
  tasks:
    - "Каждая группа задач включает обновление документации для своих изменений по таблице AGENTS.md п.11 (README.md, docs/*.md, AGENTS.md п.7/п.10, config.example.yaml) — не откладывай документацию в отдельную последнюю группу. Если документация не затронута, запиши это явно."

operations:
  apply:
    guidance:
      - "Перед тем как отметить последнюю задачу, сверь документацию с изменениями по AGENTS.md п.11 и прогони pytest tests/test_docs.py."
  archive:
    guidance:
      - "При архивации обнови AGENTS.md п.7 (строка таблицы change'ей, бэклог) и статус дорожной карты в openspec/config.yaml. Не архивируй change, если документация не актуализирована по AGENTS.md п.11."
